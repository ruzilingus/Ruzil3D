name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Сборка (net35 и netstandard2.0)
        run: dotnet build Ruzil3D.sln --configuration Release

      - name: Тесты
        run: dotnet test Ruzil3D.sln --configuration Release --no-build --verbosity normal

      - name: Пакет NuGet
        run: dotnet pack Ruzil3D.csproj --configuration Release --no-build --output artifacts
